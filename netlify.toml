[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# The content security policy is not here: it lists a hash for each inline
# script Next.js writes, so `npm run build` generates it into out/_headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"

# File names under /_next/static carry a content hash, so they never change.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The recordings are large and change only with a new file; a day's cache spares a repeat visit refetching them.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The agent guide is read as markdown, by agents and by browsers alike.
# scripts/serve.mjs sends the same type by extension, so the end-to-end tests see it too.
[[headers]]
  for = "/uno-blueprint.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

# The demo is the template app, deployed as its own site and built for /demo/.
# A 200 rewrite keeps visitors on this address while the demo site serves it.
[[redirects]]
  from = "/demo/*"
  to = "https://uno-blueprint-demo.netlify.app/demo/:splat"
  status = 200
  force = true
