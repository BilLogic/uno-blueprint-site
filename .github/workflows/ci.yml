name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a pull request's run; every run on main finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          include-hidden-files: true
          retention-days: 7
      # The site above is built as CI and previews are: without Clarity. Rebuild as
      # Netlify's production context does (the .next cache keeps it short) and check
      # the tag and its policy. It overwrites out/, after the upload, so no later job sees it.
      - run: CONTEXT=production npm run build
      - run: node --experimental-strip-types scripts/check-clarity-build.mjs

  e2e:
    name: End-to-end, axe and visual snapshots
    needs: build
    runs-on: ubuntu-latest
    # The image pins the browser and its fonts, so snapshots render the same here as in
    # the local `docker run` command in the README.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - run: npx playwright test
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      # When a baseline is missing, Playwright writes the Linux render in its place; this
      # artifact is how a new or changed snapshot gets from CI into a commit.
      - name: Upload snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: e2e/__snapshots__
          retention-days: 7

  # The /demo/ forward is a Netlify rewrite, so it is checked on the pull request's deploy preview.
  demo-forward:
    name: Demo through the forward (deploy preview)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # The Netlify site that builds this repository; its previews live under its name.
      SITE: uno-blueprint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-demo-forward.mjs "https://deploy-preview-${{ github.event.pull_request.number }}--$SITE.netlify.app" https://uno-blueprint-demo.netlify.app

  lighthouse:
    name: Lighthouse (phone)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - run: npm run lhci
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 7
